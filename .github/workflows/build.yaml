name: Build and Release Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（不带 v，例如 1.2.3；留空则使用运行号）"
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn

      - name: Build project
        run: yarn build

      - name: Resolve release version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="0.0.${GITHUB_RUN_NUMBER}"
            fi
          else
            # Extract version from tag (remove 'v' prefix)
            VERSION=${GITHUB_REF_NAME#v}
          fi

          # Validate semantic version format (X.Y.Z)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version '$VERSION' is not a valid semantic version (X.Y.Z format)"
            echo "Expected format: X.Y.Z (e.g., 1.2.3)"
            exit 1
          fi

          echo "Valid semantic version detected: $VERSION"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "CHANGELOG=Automated release ${VERSION}." >> "$GITHUB_ENV"

      - name: Update theme configuration
        run: |
          # Update komari-theme.json with the resolved release version
          jq --arg version "$VERSION" \
              '.version = $version' \
              komari-theme.json > komari-theme-updated.json

          mv komari-theme-updated.json komari-theme.json

          echo "Updated theme configuration:"
          cat komari-theme.json

      - name: Prepare preview image
        run: |
          if [ ! -f preview.png ]; then
            SOURCE_PREVIEW="public/examples/PurCarte-Theme-Config-New.png"
            if [ ! -f "$SOURCE_PREVIEW" ]; then
              echo "No preview image found at preview.png or $SOURCE_PREVIEW"
              exit 1
            fi
            cp "$SOURCE_PREVIEW" preview.png
            echo "Using $SOURCE_PREVIEW as the release preview image"
          fi

      - name: Verify required files exist
        run: |
          echo "Checking required files..."
          ls -la preview.png || (echo "preview.png not found" && exit 1)
          ls -la komari-theme.json || (echo "komari-theme.json not found" && exit 1)
          ls -la dist/ || (echo "dist/ directory not found" && exit 1)
          echo "All required files found!"

      - name: Create theme package
        run: |
          # Create a temporary directory for the package
          mkdir -p theme-package

          # Copy required files
          cp preview.png theme-package/
          cp komari-theme.json theme-package/
          cp -r dist/ theme-package/

          # Create zip file with version and commit hash
          ZIP_NAME="komari-theme-purcarte.zip"

          cd theme-package
          zip -r ../${ZIP_NAME} .
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Created package: ${ZIP_NAME}"
          ls -la ${ZIP_NAME}

      - name: Generate Changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: changelog
        run: |
          git fetch --prune
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 `git rev-list --tags --skip=1 --max-count=1` 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "Previous tag: $PREVIOUS_TAG"
          CHANGELOG=$(git log $PREVIOUS_TAG..${{ github.ref_name }} --pretty=format:"* %s (%h)")
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        if: success() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: ${{ env.CHANGELOG }}
          draft: false
          prerelease: false
          files: ${{ env.ZIP_NAME }}
